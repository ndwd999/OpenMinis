name: Build Android APK

# 只做 Android：官方 iOS 原生依赖（iSH/Metal/FFmpeg）仅 macOS runner 可构建，
# 且 macOS 在 GitHub 免费额度里按 3 倍速率计费。此处刻意限定 ubuntu。
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Gradle build type"
        type: choice
        options:
          - release
          - debug
        default: release
  push:
    branches:
      - main
    paths:
      - "src/android/**"
      - "deps/**"
      - "scripts/prepare_android_sandbox.sh"
      - ".github/workflows/build-android.yml"

# 完整原生构建（proot + rclone + 沙箱 rootfs）耗时较长，放宽超时。
jobs:
  build:
    name: Build APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 注意：不要用 checkout 的 `submodules:` 输入。实测它在本仓库
          # 静默不生效——fetch 走的是 --no-recurse-submodules，日志里连
          # "Getting submodules" 分组都没有出现，结果 deps/proot 是空目录，
          # 直到 build_proot.sh 才报 "PRoot source missing"。改由下面
          # 显式两步完成，并各自带断言，失败点直接落在真正的原因上。
          persist-credentials: false

      - name: Fetch PRoot submodule
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule sync
          # 只取 deps/proot：deps/ish 是 iOS 沙箱内核，本工作流构建 Android。
          git submodule update --init --depth 1 deps/proot
          # 断言源码真的落地。判据与 deps/build_proot.sh:263 保持一致
          # （那里检查的就是 $PROOT_DIR/src）；proot 是上游 layout，
          # 根目录没有 configure/Makefile，别用它们判空。
          if [ ! -d deps/proot/src ]; then
            echo "::error::deps/proot 检出为空——gitlink 指向的 commit 可能不可达"
            git submodule status || true
            exit 1
          fi
          echo "deps/proot 已检出：$(git -C deps/proot rev-parse --short HEAD)"
          ls deps/proot | head -5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache native build artifacts
        # 官方 README 指出原生产物随 NDK 版本不同而不同，但在同一 runner
        # 镜像上缓存可省去每次重编 proot 的一段时间。
        uses: actions/cache@v4
        with:
          path: |
            deps/build
            src/android/app/libs
          key: native-${{ runner.os }}-${{ hashFiles('deps/build_proot.sh', 'deps/build_rclone_android.sh') }}
          restore-keys: |
            native-${{ runner.os }}-

      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config

      # ─────────────────────────────────────────────────────────────────────
      # 刻意不使用 android-actions/setup-android@v3。
      # 该 action 在接受许可之后会额外执行一次 `sdkmanager tools`，而 Google
      # 已把这个 legacy 包从 SDK 仓库下架，于是必然：
      #     Warning: Failed to find package 'tools'
      #     Error: ... failed with exit code 1
      # 即许可其实已全部接受（"All SDK package licenses accepted"），失败
      # 发生在安装这个被下架的包这一步。ubuntu runner 镜像本身已预装完整
      # SDK（/usr/local/lib/android/sdk），因此直接用预装 SDK，无需任何
      # setup-android / cmdline-tools 下载。
      - name: Locate preinstalled Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "::error::no Android SDK at $SDK"; exit 1
          fi
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f -perm -u+x | sort | tail -1)"
          fi
          [ -x "$SDKMANAGER" ] || { echo "::error::sdkmanager not found under $SDK"; exit 1; }
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version
          echo "--- preinstalled packages ---"
          ls "$SDK"
          ls "$SDK/platforms" 2>/dev/null || true
          ls "$SDK/build-tools" 2>/dev/null || true
          ls "$SDK/ndk" 2>/dev/null || true
          ls "$SDK/cmake" 2>/dev/null || true

      - name: Accept Android SDK licenses
        run: |
          set -euo pipefail
          # licenses 直接写入 $ANDROID_SDK_ROOT/licenses，Gradle/AGP 之后
          # 自动补装缺失组件时也会复用这份已接受的许可。
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          ls "$ANDROID_SDK_ROOT/licenses"

      - name: Install SDK packages
        run: |
          set -euo pipefail
          # compileSdk=36 / targetSdk=35 见 src/android/app/build.gradle.kts；
          # externalNativeBuild.cmake.version 硬编码 3.22.1，故装对应 cmake。
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "cmake;3.22.1"
          # build_proot.sh 明确要求 NDK r28+；gomobile bind 也需要一个 NDK。
          "$SDKMANAGER" "ndk;28.0.13004108"
          NDK_DIR="$ANDROID_SDK_ROOT/ndk/28.0.13004108"
          if [ ! -d "$NDK_DIR" ]; then
            # 版本号若被 Google 调整，退而取任意可用的 28.x
            NDK_DIR="$(ls -1d "$ANDROID_SDK_ROOT"/ndk/28.* 2>/dev/null | sort -V | tail -1 || true)"
          fi
          [ -n "$NDK_DIR" ] && [ -d "$NDK_DIR" ] || { echo "::error::NDK r28 not installed"; exit 1; }
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"
          "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" --version | head -2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # ubuntu-24.04 自带的 apt golang 是 1.22，而 golang.org/x/mobile
          # 要求 go >= 1.26.0。setup-go 装官方发行版，避免 apt 的旧版本。
          go-version: "1.26.x"
          cache: false

      - name: Set up gomobile
        run: |
          set -euo pipefail
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          "$(go env GOPATH)/bin/gomobile" init
          # gomobile 装在 $GOPATH/bin，不在 runner 默认 PATH 上；
          # 后续 build_rclone_android.sh 直接调用 `gomobile`，故必须导出。
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/gomobile" version

      - name: Build PRoot (native)
        run: ./deps/build_proot.sh

      - name: Prepare Android sandbox rootfs
        run: ./scripts/prepare_android_sandbox.sh

      - name: Build rclone for Android
        run: ./deps/build_rclone_android.sh

      - name: Stage rclone.aar
        run: |
          mkdir -p src/android/app/libs
          cp deps/build/rclone/rclone.aar src/android/app/libs/

      - name: Create provider-customization.properties
        run: |
          # 公开仓库只提供 .example 空值模板；空值可编译可运行，
          # 仅 Claude OAuth 登录会在运行时失败（API key 登录不受影响）。
          cp src/android/app/provider-customization.properties.example \
             src/android/app/provider-customization.properties

      - name: Verify sandbox assets present
        run: |
          set -euo pipefail
          # 沙箱资产缺失时应用能启动但 execve 失败，症状隐蔽，
          # 因此在构建期就断言三件套齐全。
          for f in assets/proot-aarch64 \
                   jniLibs/arm64-v8a/libproot-loader.so \
                   jniLibs/arm64-v8a/libproot-loader32.so; do
            if [ ! -e "src/android/app/src/main/$f" ]; then
              echo "::error::missing $f — rerun deps/build_proot.sh"; exit 1
            fi
          done
          ls -la src/android/app/src/main/assets/

      - name: Build APK
        working-directory: src/android
        run: ./gradlew :app:assemble${{ github.event.inputs.build_type || 'Release' }} --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MinisApp-${{ github.event.inputs.build_type || 'release' }}-arm64-v8a
          path: src/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
